name: Rally
options:
  bundleIdPrefix: com.kelseyroche
  deploymentTarget:
    iOS: "17.0"
packages:
  RallyKit:
    path: .
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
targets:
  Rally:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: RallyKit
        product: RallyKit
      - package: Supabase
        product: Supabase
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Rally
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~iphone: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.kelseyroche.rally
        SWIFT_VERSION: "6.0"
